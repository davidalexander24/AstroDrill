spring.application.name=Backend

# Datasource: reads PG* env vars (Railway's Postgres plugin sets these automatically).
# Defaults match the local dev setup so `npm run backend` still works without any env vars.
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:astrodrill_db}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Port: Railway injects PORT; locally fall back to 8080.
server.port=${PORT:8080}
