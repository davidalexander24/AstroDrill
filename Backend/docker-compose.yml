services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-astrodrill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-astrodrill_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - astrodrill-net

  backend:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-astrodrill_db}
      PGUSER: ${POSTGRES_USER:-astrodrill}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PORT: "8080"
    depends_on:
      - postgres
    networks:
      - astrodrill-net

volumes:
  pgdata:

networks:
  astrodrill-net:
    driver: bridge
